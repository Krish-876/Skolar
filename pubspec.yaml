name: Skolar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^17.3.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  get_it: ^9.2.1
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  logger: ^2.8.0
  uuid: ^4.6.0
  intl: ^0.20.3
  dartz: ^0.10.0
  http: ^1.1.0
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  file_picker: ^12.3.0
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^3.2.1
  supabase: ^2.16.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  flutter_animate: ^4.5.2
  rive: 0.14.11
  gif: ^2.3.0
  supabase_flutter: ^2.14.0
  model_viewer_plus: ^1.10.0
  avatar_maker: ^1.7.0
  lottie: ^3.5.1
  flutter_svg: ^2.3.0
  video_player: ^2.9.2
  flutter_heatmap_calendar: ^1.0.5
  shimmer: ^4.0.0
  dotlottie_loader: ^0.0.6
  wakelock_plus: ^1.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/animations/
    - assets/animations/tick_frames/
    - assets/models/
    - assets/sounds/
    - .env
    
  fonts:                      
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.otf
        - asset: assets/fonts/ClashDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
