repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2   # run `pre-commit autoupdate` periodically to bump this
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4    # run `pre-commit autoupdate` periodically to bump this
    hooks:
      - id: ruff
        args: [--select, "S", --fix]
      - id: ruff-format