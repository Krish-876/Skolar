name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            python:
              - 'backend/**'

  # NEW: runs on every push/PR regardless of what changed - cheap, and a
  # leaked key doesn't care whether it's Dart or Python that leaked it.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks needs full history, not just the diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NEW: catches a tracked .env file that gitleaks' generic entropy rules
  # can miss. Cheap, and not gated by the changes filter since a leaked
  # .env doesn't care whether it's Dart or Python that leaked it.
  env-file-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check for a committed .env file
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::A file named .env is tracked in git. Remove it and rotate any secrets it contained."
            exit 1
          fi

  format:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"

          if [ ${#TITLE} -gt 100 ]; then
            echo "PR title exceeds 100 characters."
            exit 1
          fi

          if [[ "$TITLE" =~ [[:space:]]$ ]] || [[ "$TITLE" =~ \.$ ]]; then
            echo "PR title must not end with a period, space, or tab."
            exit 1
          fi

          PATTERN='^(feat|fix|schema|refactor|test|docs|style|chore|perf|ci)(\([a-z0-9_-]+\))?: .+$'
          if ! [[ "$TITLE" =~ $PATTERN ]]; then
            echo "PR title must match: <type>: <summary>"
            echo "Valid types: feat, fix, schema, refactor, test, docs, style, chore, perf, ci"
            exit 1
          fi

          echo "PR title is valid."

  codegen:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail if codegen produced uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run build_runner locally and commit the output."
            git status --porcelain
            exit 1
          fi

  analyze:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Create placeholder .env for CI
        run: echo "" > .env
      - name: Analyze
        run: dart analyze

  test:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Create placeholder .env for CI
        run: echo "" > .env
      - name: Run tests
        run: flutter test --coverage

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend/
      - name: Security lint
        # Bandit-derived rules ported into ruff: hardcoded secrets, unsafe
        # eval/exec, weak crypto, SQL string concatenation, etc.
        # Kept as a separate step (not merged into --select above) so a new
        # security finding fails with an unambiguous step name in the UI.
        run: ruff check --select S backend/
      - name: Block legacy retry decorator on genai calls
        # api_core.retry.if_transient_error doesn't recognize
        # google.genai.errors.APIError, so 429s from genai calls pass
        # through unretried. Use types.HttpRetryOptions on the genai client
        # config instead.
        run: |
          if grep -rq 'api_core.retry.if_transient_error' backend/; then
            echo "::error::Found api_core.retry.if_transient_error in backend/. This predicate doesn't recognize google.genai.errors.APIError, so 429s from genai calls pass through unretried. Use types.HttpRetryOptions instead."
            exit 1
          fi
      - name: Type check
        run: |
          if [ -d "backend/nova" ]; then
            mypy backend/nova --ignore-missing-imports
          fi

  branch-up-to-date:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure branch is up to date with master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "Branch is behind master - rebase before pushing (git fetch origin && git rebase origin/master)."
            exit 1
          fi
